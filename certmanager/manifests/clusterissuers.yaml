---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-xxxxxxxx-com
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: it-admin@xxxxxxxxxxxx
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - dns01:  
        azureDNS:
          clientID: "${cert_manager_dns_validator_client_id}"
          clientSecretSecretRef:
            name: azuredns-config
            key: client-secret
          subscriptionID: xxxxxxxxxxxxxxxxxxx
          tenantID: xxxxxxxxxxxxxxxxxxxxxxxxx
          resourceGroupName: xxxxxxxxxxxxxxxxxx
          hostedZoneName: xxxxxxxxxxxx.com
